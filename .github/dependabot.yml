version: 2

updates:
    - package-ecosystem: github-actions
      directory: /

      schedule:
          interval: weekly
          day: monday
          time: '09:15'
          timezone: America/Lima

      open-pull-requests-limit: 3

      labels:
          - 'type: chore'
          - 'area: platform'

      groups:
          github-actions-non-major:
              patterns:
                  - '*'

              update-types:
                  - minor
                  - patch

    - package-ecosystem: docker-compose
      directory: /

      schedule:
          interval: weekly
          day: thursday
          time: '09:15'
          timezone: America/Lima

      open-pull-requests-limit: 2

      labels:
          - 'type: chore'
          - 'area: platform'

      groups:
          infrastructure-images-non-major:
              patterns:
                  - '*'

              update-types:
                  - minor
                  - patch
