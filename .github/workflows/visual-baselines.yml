name: Visual Baseline Generation

on:
    workflow_dispatch:

permissions:
    contents: read

env:
    TURBO_TELEMETRY_DISABLED: '1'
    NEXT_TELEMETRY_DISABLED: '1'

jobs:
    generate-visual-baselines:
        name: Generate Visual Baselines

        runs-on: ubuntu-24.04

        timeout-minutes: 25

        env:
            DATABASE_TEST_URL: postgresql://manasiness:manasiness_local@127.0.0.1:5432/manasiness_test

            DATABASE_TEST_RUNTIME_URL: >-
                postgresql://manasiness_app:manasiness_app_local@127.0.0.1:5432/manasiness_test

            DATABASE_POOL_MAX: '10'
            DATABASE_IDLE_TIMEOUT_MS: '30000'
            DATABASE_CONNECTION_TIMEOUT_MS: '5000'

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup repository toolchain
              uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
              with:
                  cache: true
                  install: false

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Playwright Chromium
              run: pnpm exec playwright install --with-deps chromium

            - name: Generate canonical visual baselines
              env:
                  DEBUG: pw:webserver
              run: timeout --signal=INT --kill-after=15s 240s pnpm test:visual:update

            - name: Upload generated visual baselines
              if: success()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: visual-baselines-${{ github.sha }}-${{ github.run_id }}
                  path: tests/visual/__snapshots__/
                  if-no-files-found: error
                  retention-days: 7

            - name: Upload generation failure diagnostics
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: visual-baseline-generation-failure-${{ github.run_id }}-${{ github.run_attempt }}
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore
                  retention-days: 7

            - name: Stop PostgreSQL
              if: always()
              run: docker compose down --volumes --remove-orphans || true
