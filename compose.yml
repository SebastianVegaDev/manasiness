name: manasiness

services:
    postgres:
        image: postgres:18.6-alpine
        environment:
            POSTGRES_USER: manasiness
            POSTGRES_PASSWORD: manasiness_local
            POSTGRES_DB: manasiness_dev
        ports:
            - '127.0.0.1:5432:5432'
        volumes:
            - manasiness_postgres_data:/var/lib/postgresql
            - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 5s
        stop_grace_period: 30s

volumes:
    manasiness_postgres_data:
